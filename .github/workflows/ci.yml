name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit + integration tests (Testcontainers uses the runner's Docker)
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t spacedvocab-api:ci .
