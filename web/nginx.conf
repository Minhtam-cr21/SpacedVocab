# Serves the built React app and forwards API calls to the `app` service,
# so the browser talks to one origin (no CORS) at http://localhost:${WEB_PORT}.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8080;
        # $http_host keeps the port (localhost:3000). With $host the port is lost, Spring sees
        # Origin http://localhost:3000 ≠ Host localhost and rejects POST/PUT/DELETE as cross-origin (403).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hashed build files never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: unknown paths load index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
