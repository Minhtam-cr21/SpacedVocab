<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D14 Tổng kết phiên · SpacedVocab</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/components.css">
  <script src="../assets/app.js" defer></script>
</head>
<body data-shell="focus" data-page="review-summary">
<main class="page page-narrow center" style="padding-top:var(--space-12)">
  <div style="font-size:56px" aria-hidden="true">🎉</div>
  <h1>Hoàn thành phiên ôn!</h1>
  <p class="muted">Chuỗi ngày học của bạn tăng lên <strong>🔥 13 ngày</strong>.</p>

  <div class="row mt-6" style="justify-content:center">
    <div class="ring" id="sum-ring" style="--value:84"><div><strong style="font-size:var(--text-xl)" id="sum-rate">84%</strong><span class="small muted">nhớ được</span></div></div>
  </div>

  <div class="grid grid-3 mt-6">
    <div class="card stat-tile"><span class="label">Đã ôn</span><span class="value" id="sum-reviewed">32</span></div>
    <div class="card stat-tile"><span class="label">Thẻ mới</span><span class="value">18</span></div>
    <div class="card stat-tile"><span class="label">Thời gian</span><span class="value">8:42</span></div>
  </div>

  <div class="card mt-4" style="text-align:left">
    <h2 style="font-size:var(--text-lg)">Từ cần chú ý</h2>
    <p class="muted small mt-0">Bạn bấm "Quên" ở các từ này — chúng sẽ quay lại vào ngày mai.</p>
    <div class="row"><span class="badge badge-danger content-en" lang="en">mitigate</span><span class="badge badge-danger content-en" lang="en">scrutinize</span></div>
  </div>

  <div class="stack mt-6">
    <a class="btn btn-primary btn-lg btn-block" href="dashboard.html">Về trang chủ</a>
    <a class="btn btn-ghost" href="stats.html">Xem thống kê chi tiết</a>
  </div>
</main>
</body>
</html>
