spring:
  application:
    name: spacedvocab-api
  datasource:
    # Secrets come from environment variables (see .env.example), never from this file.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spacedvocab}
    username: ${DB_USERNAME:spacedvocab}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}          # required, ≥ 32 characters; the app fails fast without it
    issuer: spacedvocab
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # optional: first ADMIN account created on startup if it does not exist yet
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
