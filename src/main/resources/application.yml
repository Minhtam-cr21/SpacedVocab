spring:
  application:
    name: spacedvocab-api
  datasource:
    # Secrets come from environment variables (see .env.example), never from this file.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spacedvocab}
    username: ${DB_USERNAME:spacedvocab}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
